<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>javas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Rubik+Mono+One&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="titulo">javas</h1>

    <div class="stickers">
      <button class="sticker" type="button" aria-label="Clicar na figurinha de raiva">
        <img src="img/raiva.jpg" alt="Emoji laranja com cara de raiva e a palavra Raiva">
      </button>
      <button class="sticker" type="button" aria-label="Clicar na figurinha de ódio">
        <img src="img/odio.jpg" alt="Emoji bravo com a frase só ódio na desgraça">
      </button>
    </div>

    <p class="frase" id="frase" aria-live="polite">clica nas figurinhas</p>

    <div class="contador">
      <span>raiva acumulada</span>
      <strong id="contador">0</strong>
    </div>

    <div class="botoes">
      <button type="button" id="btn-frase">Sortear frase</button>
      <button type="button" id="btn-chuva">Chuva de raiva</button>
      <button type="button" id="btn-zerar" class="secundario">Zerar</button>
    </div>
  </main>

  <div id="chuva" aria-hidden="true"></div>

  <script src="script.js"></script>
</body>
</html>
